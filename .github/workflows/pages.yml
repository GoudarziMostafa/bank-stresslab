name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6.0.0
      - name: Package static dashboard
        shell: bash
        run: |
          mkdir -p site
          cp dashboard/{app.js,data.json,index.html,style.css} site/
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/"
          sed -i "s|href=\"\.\./|href=\"$source_url|g" site/{index.html,app.js}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
